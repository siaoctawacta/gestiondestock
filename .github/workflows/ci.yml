name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Backend Laravel (hébergement LWS) : tests de l'API sur MySQL, comme en production
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mmstock_test
          MYSQL_USER: mmstock
          MYSQL_PASSWORD: mmstock
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mmstock_test
      DB_USERNAME: mmstock
      DB_PASSWORD: mmstock
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, intl, gd, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  # Alternative Supabase (dossier backend-supabase/)
  backend-supabase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-supabase
    steps:
      - uses: actions/checkout@v4
      # Version figée : « latest » interroge l'API GitHub sans authentification
      # et échoue dès que la limite de requêtes est atteinte.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase db start
      - run: supabase test db
